<!DOCTYPE html>
<html lang="en">
    <!-- Website setup -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Kanit&display=swap');
        </style>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&ampicon_names=menu" />
        <title>BerrySun's Website</title>
        <link rel="stylesheet" href="/css/videos.css">
        <link rel="icon" type="image/png" href="/assets/overall/favicon.png">
    </head>
    <!-- Website itself -->
    <body class="overall">
        <!-- Page header and page menu for site navigation -->
        <header class="header">
            <span id="buttonMenu" class="material-symbols-outlined">menu</span>
            <div id="areaMenu">
                <button id="buttonHome">Home</button>
                <button id="buttonAbout">About</button>
                <button id="buttonVideos">Videos</button>
            </div>
            <p>BerrySun's Website</p>
        </header>

        <!-- Page exclusive content -->
        <page class="page">
            <div class="areaPage1">
                <h1 id="textHeader1">Korok Video</h1>
                <button id="buttonPage1">Click me!</button>
                <div id="areaPage1">
                    <video controls autoplay muted src="/assets/videos/korokLaunch.mp4" alt="A Korok take off video." width="1280" height="720"></video>
                    <p>He's having fun!</p>
                </div>
            </div>
            <div class="areaPage2">
                <h1 id="textHeader2">F-Zero 99 Video</h1>
                <button id="buttonPage2">Click me!</button>
                <div id="areaPage2">
                    <video controls autoplay muted src="/assets/videos/chaos.mp4" alt="A very close call." width="1280" height="720"></video>
                    <p>Close Call</p>
                </div>
            </div>
        </page>

        <!-- Page footer and images -->
        <footer class="footer">
            <img src="/assets/overall/neurodivergent.webp" alt="I'm neurodivergent!" width="300" height="40">
            <div>
                <p>Hosted<br>By</p>
                <img src="/assets/overall/neocities.png" alt="NeoCities is the website hoster for this website." width="605" height="275">
            </div>
        </footer>

        <!-- Page script -->
        <script src="/js/videos.js"></script>
    </body>
</html>
