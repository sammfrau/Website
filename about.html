<!DOCTYPE html>
<html lang="en">
    <!-- Website setup -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Kanit&display=swap');
        </style>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&ampicon_names=menu" />
        <title>BerrySun's Website</title>
        <link rel="stylesheet" href="/css/about.css">
        <link rel="icon" type="image/png" href="/assets/overall/favicon.png">
    </head>
    <!-- Website itself -->
    <body class="overall">
        <!-- Page header and page menu for site navigation -->
        <header class="header">
            <span id="buttonMenu" class="material-symbols-outlined">menu</span>
            <div id="areaMenu">
                <button id="buttonHome">Home</button>
                <button id="buttonAbout">About</button>
                <button id="buttonVideos">Videos</button>
            </div>
            <p>BerrySun's Website</p>
        </header>

        <!-- Page exclusive content -->
        <page class="page">
            <div1>
                <h1>About Me</h1>
                <img src="/assets/about/berrysun.jpg" alt="This is a picture of me." width="512" height="512">
                <p>Big Gamer Energy</p>
            </div1>
            <div2>
                <h2>About James</h2>
                <img src="/assets/about/sniff.jpg" alt="James sniff" width="600" height="800">
                <img src="/assets/about/begs.jpg" alt="James begs" width="600" height="800">
                <img src="/assets/about/yoshi.jpg" alt="James eats Yoshi" width="600" height="800">
                <p>He's a good kitty</p>
            </div2>
        </page>

        <!-- Page footer and images -->
        <footer class="footer">
            <img src="/assets/overall/neurodivergent.webp" alt="I'm neurodivergent!" width="300" height="40">
            <div>
                <p>Hosted<br>By</p>
                <img src="/assets/overall/neocities.png" alt="NeoCities is the website hoster for this website." width="605" height="275">
            </div>
        </footer>

        <!-- Page script -->
        <script src="/js/about.js"></script>
    </body>
</html>
